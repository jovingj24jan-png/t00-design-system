<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Nexora</title>
  <meta name="robots" content="noindex">
  <script src="config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<a class="skip-link" href="#signin-form" data-i18n="skipToForm">Skip to sign-in form</a>

<div class="auth">
  <section class="auth__brand" data-auth-brand></section>

  <main class="auth__panel" id="content">
    <div class="auth__wrap">
      <header class="auth__head">
        <h1 class="auth__title" data-i18n="welcomeBack"></h1>
        <p class="auth__sub" data-i18n="signInTo"></p>
      </header>

      <div class="auth__alerts">
        <div class="auth-alert auth-alert--paused" data-paused role="status" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>
          <p data-i18n="schoolPaused"></p>
        </div>
        <div class="auth-alert auth-alert--error" data-alert role="alert" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
          <p data-alert-text></p>
        </div>
        <div class="auth-alert auth-alert--error" data-lockout hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
          <div>
            <p role="alert" data-i18n="tooManyAttempts"></p>
            <p class="auth-alert__timer" role="timer" data-lockout-timer></p>
          </div>
        </div>
        <p class="auth-status" data-status role="status" aria-live="polite"></p>
      </div>

      <form class="auth-form" id="signin-form" novalidate data-signin-form>
        <div class="field">
          <label class="field__label" for="signin-id" data-i18n="emailOrPhone"></label>
          <input class="input" id="signin-id" name="identifier" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" dir="auto" required aria-describedby="signin-id-error" data-i18n-placeholder="emailOrPhonePlaceholder">
          <p class="field__hint field__hint--error" id="signin-id-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="signin-password" data-i18n="password"></label>
          <div class="auth-pass">
            <input class="input" id="signin-password" name="password" type="password" autocomplete="current-password" required aria-describedby="signin-password-error" data-i18n-placeholder="passwordPlaceholder">
            <button class="auth-pass__toggle" type="button" aria-controls="signin-password" aria-pressed="false" data-toggle-password></button>
          </div>
          <p class="field__hint field__hint--error" id="signin-password-error" hidden></p>
        </div>

        <div class="auth-form__row">
          <label class="check"><input type="checkbox" name="remember" checked><span data-i18n="rememberMe"></span></label>
          <a class="auth-link" href="#" data-route="forgotPassword" data-i18n="forgotPassword"></a>
        </div>

        <button class="btn btn--block auth-btn" type="submit" data-submit data-label="signIn"><span data-i18n="signIn"></span></button>

        <div class="auth-sso" data-sso hidden>
          <p class="auth-divider"><span data-i18n="or"></span></p>
          <button class="btn btn--block auth-btn auth-btn--outline" type="button" data-sso-button><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg><span data-i18n="signInWithSso"></span></button>
        </div>
      </form>

      <details class="auth-demo">
        <summary data-i18n="demoTitle"></summary>
        <div class="auth-demo__body" lang="en" dir="ltr">
          <p data-demo-note></p>
          <ul data-demo-accounts></ul>
          <p data-demo-schools></p>
        </div>
      </details>

      <footer class="auth-foot" data-auth-foot></footer>
    </div>
  </main>
</div>

<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="toast.js"></script>
<script src="auth.js"></script>
<script src="auth-ui.js"></script>
<script src="backdrop.js"></script>
<script src="signin.js"></script>
<script src="motion.js"></script>
</body>
</html>
