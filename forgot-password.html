<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Reset password · Nexora</title>
  <meta name="robots" content="noindex">
  <script src="config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<div class="auth">
  <section class="auth__brand" data-auth-brand></section>

  <main class="auth__panel" id="content">
    <div class="auth__wrap rs">
      <div class="rs-progress">
        <p class="rs-progress__label" data-step-label></p>
        <div class="rs-progress__bar" aria-hidden="true"><span data-step-seg="1"></span><span data-step-seg="2"></span><span data-step-seg="3"></span></div>
      </div>

      <!-- Step 1 — find your account -->
      <form class="rs-step" data-step="1" novalidate>
        <header class="auth__head">
          <h1 class="auth__title" tabindex="-1" data-i18n="s1Title"></h1>
          <p class="auth__sub" data-i18n="s1Text"></p>
        </header>
        <div class="auth-alert auth-alert--error" data-alert="1" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><p data-alert-text></p></div>
        <div class="field">
          <label class="field__label" for="rs-email" data-i18n="emailAddress"></label>
          <input class="input" id="rs-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" dir="auto" required aria-describedby="rs-email-error" data-i18n-placeholder="emailPlaceholder">
          <p class="field__hint field__hint--error" id="rs-email-error" hidden></p>
        </div>
        <div class="rs-actions">
          <button class="btn btn--block auth-btn" type="submit" data-send data-label="sendResetLink"><span data-i18n="sendResetLink"></span></button>
          <a class="auth-link rs-actions__link" href="#" data-back-signin data-i18n="backToSignIn"></a>
        </div>
      </form>

      <!-- Step 2 — check your email -->
      <section class="rs-step" data-step="2" hidden aria-labelledby="rs-s2-title">
        <button class="rs-back" type="button" data-back><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg><span data-i18n="back"></span></button>
        <svg class="rs-mail" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
          <rect class="rs-mail__body" x="10" y="16" width="100" height="64" rx="8"/>
          <path class="rs-mail__flap" d="M12 22l48 34 48-34"/>
          <path class="rs-mail__line" d="M12 76l36-26M108 76L72 50"/>
          <circle class="rs-mail__dot" cx="104" cy="18" r="10"/>
        </svg>
        <header class="auth__head">
          <h1 class="auth__title" id="rs-s2-title" tabindex="-1" data-i18n="s2Title"></h1>
          <p class="auth__sub" data-s2-text></p>
        </header>
        <div class="auth-alert auth-alert--error" data-alert="2" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><p data-alert-text></p></div>
        <p class="auth-status rs-status" data-status role="status" aria-live="polite"></p>
        <div class="rs-actions">
          <button class="btn btn--block auth-btn" type="button" data-open-link data-label="openDemoLink"><span data-i18n="openDemoLink"></span></button>
          <p class="rs-note" data-i18n="demoLinkNote"></p>
          <button class="btn btn--block auth-btn auth-btn--outline" type="button" data-resend data-label="resend"></button>
        </div>
      </section>

      <!-- Step 3 — set a new password -->
      <form class="rs-step" data-step="3" hidden novalidate>
        <button class="rs-back" type="button" data-back><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg><span data-i18n="back"></span></button>
        <header class="auth__head">
          <h1 class="auth__title" tabindex="-1" data-i18n="s3Title"></h1>
          <p class="auth__sub" data-i18n="s3Text"></p>
        </header>
        <div class="auth-alert auth-alert--error rs-invalid" data-link-invalid role="alert" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
          <div><p data-i18n="linkInvalid"></p><button class="auth-link" type="button" data-new-link data-i18n="requestNewLink"></button></div>
        </div>
        <div class="auth-alert auth-alert--error" data-alert="3" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><p data-alert-text></p></div>

        <div class="field">
          <label class="field__label" for="rs-new" data-i18n="newPassword"></label>
          <div class="auth-pass">
            <input class="input" id="rs-new" name="new" type="password" autocomplete="new-password" required aria-describedby="rs-rules rs-strength">
            <button class="auth-pass__toggle" type="button" aria-controls="rs-new" data-toggle="rs-new"></button>
          </div>
          <ul class="rs-rules" id="rs-rules" data-i18n-aria-label="passwordRules">
            <li data-rule="length"><svg class="icon" aria-hidden="true"><use href="#i-circle"/></svg><span data-i18n="ruleLength"></span><span class="sr-only" data-rule-state></span></li>
            <li data-rule="number"><svg class="icon" aria-hidden="true"><use href="#i-circle"/></svg><span data-i18n="ruleNumber"></span><span class="sr-only" data-rule-state></span></li>
            <li data-rule="symbol"><svg class="icon" aria-hidden="true"><use href="#i-circle"/></svg><span data-i18n="ruleSymbol"></span><span class="sr-only" data-rule-state></span></li>
            <li data-rule="upper"><svg class="icon" aria-hidden="true"><use href="#i-circle"/></svg><span data-i18n="ruleUpper"></span><span class="sr-only" data-rule-state></span></li>
          </ul>
          <div class="rs-strength" id="rs-strength" data-level="none">
            <span class="rs-strength__track" aria-hidden="true"><span class="rs-strength__fill"></span></span>
            <span class="rs-strength__label"><span class="sr-only" data-i18n="strength"></span><span data-strength-label></span></span>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="rs-confirm" data-i18n="confirmPassword"></label>
          <div class="auth-pass">
            <input class="input" id="rs-confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="rs-confirm-error">
            <button class="auth-pass__toggle" type="button" aria-controls="rs-confirm" data-toggle="rs-confirm"></button>
          </div>
          <p class="field__hint field__hint--error" id="rs-confirm-error" aria-live="polite" hidden></p>
        </div>

        <div class="rs-actions">
          <button class="btn btn--block auth-btn" type="submit" data-save data-label="savePassword" disabled><span data-i18n="savePassword"></span></button>
        </div>
      </form>

      <footer class="auth-foot" data-auth-foot></footer>
    </div>
  </main>
</div>

<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="toast.js"></script>
<script src="auth.js"></script>
<script src="auth-ui.js"></script>
<script src="backdrop.js"></script>
<script src="reset.js"></script>
<script src="motion.js"></script>
</body>
</html>
